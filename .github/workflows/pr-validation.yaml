name: PR - Validation Pipeline

on:
  push:
    branches: ['main']
    # types: [opened, synchronize, reopened]
    # Path filtering (Only trigger for specific file changes)
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/**'

# Cancel previous run for same PR when new commit is pushed.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Declare all permissions needed across all jobs.
permissions:
  contents: read # Checkout code
  pull-requests: write # Post PR comment
  security-events: write # Upload SARIF to Security tab
  id-token: write # OIDC auth for AWS + Cosign

jobs:
  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/reusable-secret-scan.yaml
    secrets: inherit

