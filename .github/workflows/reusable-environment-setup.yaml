name: Reusable - Environment Setup

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
        required: false

# Minimal permissions only what this job needs.
permissions:
  contents: read

jobs:
  environment-setup:
    name: Setup Node and Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ inputs.node-version }}

      # --------------------------------------------------------
      # Try to restore cache
      # If cache-hit == true → dependencies already installed
      # If cache-hit == false → need to install
      #
      # Cache key uses hash of package-lock.json.
      # If lock file changes (new dependency added),
      # the hash changes, cache misses, fresh install happens.
      # --------------------------------------------------------
      - name: Restore Dependency Cache
        id: cache-restore
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install Dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        # - npm ci: strict, uses exact versions from package-lock.json
        # - npm install: flexible, may update versions
        run: npm ci

      - name: Save Dependency Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Print Versions for Debug
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Cache hit: ${{ steps.cache-restore.outputs.cache-hit }}"
