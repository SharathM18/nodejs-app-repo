name: Reusable - Report Summary

on:
  workflow_call:
    inputs:
      # The image tag that was built (e.g., pr-123-abc4567)
      image-tag:
        type: string
        required: true
      # Overall pipeline status: 'success' or 'failure'
      pipeline-status:
        type: string
        required: false
        default: "unknown"

# Minimal permissions only what this job needs.
permissions:
  contents: read
  pull-requests: write

jobs:
  report-summary:
    name: Generate and Post PR Report
    runs-on: ubuntu-latest

    # Always run — even if previous jobs failed.
    # Reviewer needs the summary regardless of outcome.
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download All Job Artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8bfe4fa4dc69 # v4.2.1
        with:
          path: all-reports # Download into this folder
        continue-on-error: true # Some reports may not exist if job was skipped

      - name: Generate Summary Comment
        id: generate-summary
        run: |
          # Read Trivy FS report (dependency vulnerabilities)
          TRIVY_FS_CRITICAL=0
          TRIVY_FS_HIGH=0
          if [ -f "all-reports/trivy-fs-report/trivy-fs.json" ]; then
            TRIVY_FS_CRITICAL=$(cat all-reports/trivy-fs-report/trivy-fs.json | \
              python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = sum(1 for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) or [] if v.get('Severity') == 'CRITICAL')
          print(count)
          " 2>/dev/null || echo "0")
            TRIVY_FS_HIGH=$(cat all-reports/trivy-fs-report/trivy-fs.json | \
              python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = sum(1 for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) or [] if v.get('Severity') == 'HIGH')
          print(count)
          " 2>/dev/null || echo "0")
          fi

          # Read Trivy Image report
          TRIVY_IMG_CRITICAL=0
          TRIVY_IMG_HIGH=0
          if [ -f "all-reports/trivy-image-report/trivy-image.json" ]; then
            TRIVY_IMG_CRITICAL=$(cat all-reports/trivy-image-report/trivy-image.json | \
              python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = sum(1 for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) or [] if v.get('Severity') == 'CRITICAL')
          print(count)
          " 2>/dev/null || echo "0")
            TRIVY_IMG_HIGH=$(cat all-reports/trivy-image-report/trivy-image.json | \
              python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = sum(1 for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) or [] if v.get('Severity') == 'HIGH')
          print(count)
          " 2>/dev/null || echo "0")
          fi

          # Determine status icons
          if [ "$TRIVY_FS_CRITICAL" -gt 0 ] || [ "$TRIVY_IMG_CRITICAL" -gt 0 ]; then
            VULN_STATUS="❌"
          else
            VULN_STATUS="✅"
          fi

          # Write the markdown comment to a file
          cat > pr-comment.md << EOF
          ## 🔍 Pipeline Report

          | Check | Status | Details |
          |-------|--------|---------|
          | 🔐 Secret Scan | See Security Tab | Gitleaks full history scan |
          | 📦 Dependency Scan (SCA) | ${VULN_STATUS} | CRITICAL: ${TRIVY_FS_CRITICAL} \| HIGH: ${TRIVY_FS_HIGH} |
          | 🛡️ Code Security (SAST) | See SonarQube | Quality Gate result |
          | ✏️ Code Linting | See Security Tab | ESLint findings |
          | 🐳 Dockerfile Lint | See Security Tab | Hadolint findings |
          | 🖼️ Image Scan | ${VULN_STATUS} | CRITICAL: ${TRIVY_IMG_CRITICAL} \| HIGH: ${TRIVY_IMG_HIGH} |
          | 📋 SBOM | ✅ Generated | SPDX + CycloneDX — in Artifacts |

          ### 🐳 DEV Image Built
          \`\`\`
          ${{ inputs.image-tag }}
          \`\`\`

          ### 📁 Artifacts Available
          Download from the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}):
          - \`trivy-fs-report\` — Dependency vulnerability JSON
          - \`trivy-image-report\` — Image vulnerability JSON
          - \`test-results\` — JUnit XML test results
          - \`coverage-report\` — LCOV coverage report
          - \`sbom-spdx\` — SPDX SBOM
          - \`sbom-cyclonedx\` — CycloneDX SBOM
          - \`gitleaks-security-report\` — Secret scan SARIF

          ### 🔗 Links
          - [Full Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Security Tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)

          ---
          *Generated by PR Validation Pipeline · Commit \`${{ github.sha }}\`*
          EOF

          echo "Comment generated successfully"

      - name: Post Summary Comment to PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Read the comment file we generated
            let comment = '';
            try {
              comment = fs.readFileSync('pr-comment.md', 'utf8');
            } catch (e) {
              comment = '## Pipeline Report\n\nCould not generate report. Check the workflow run for details.';
            }

            const marker = '<!-- pipeline-report-comment -->';
            const body = marker + '\n' + comment;

            // Find existing comment from previous runs (same PR, same marker)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(c => c.body.includes(marker));

            if (existingComment) {
              // Update existing comment instead of creating a new one
              // This keeps the PR clean — one comment, always up to date
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
              console.log('Updated existing PR comment');
            } else {
              // First run — create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log('Created new PR comment');
            }
