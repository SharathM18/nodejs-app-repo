name: Reusable - Secret Scan

on:
  workflow_call:

# Minimal permissions only what this job needs.
permissions:
  contents: read # To checkout the code
  security-events: write # To upload SARIF to GitHub Security tab

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    # Hard stop at 10 minutes.
    # Secret scan on a normal repo finishes in 1-2 minutes.
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Scan
        id: gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
        continue-on-error: true
        # env:
        # Required for GitHub Organization repositories.
        # Apply for free license at gitleaks.io for org use.
        # For personal repos, this env var can be removed.
        # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF to GitHub Security Tab
        if: always() && steps.gitleaks.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: secret-scanning

      - name: Upload Gitleaks Report as Artifact
        if: always() && steps.gitleaks.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gitleaks-security-report
          path: gitleaks.sarif
          retention-days: 90

      - name: Fail Pipeline if Secrets Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "❌ Gitleaks found secrets in the codebase!"
          echo "Check the GitHub Security tab and the gitleaks-security-report artifact."
          exit 1
