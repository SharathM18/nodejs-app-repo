name: Reusable - Secret Scan

on:
  workflow_call:

# Minimal permissions only what this job needs.
permissions:
  contents: read # To checkout the code
  security-events: write # To upload SARIF to GitHub Security tab

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    # Hard stop at 10 minutes.
    # Secret scan on a normal repo finishes in 1-2 minutes.
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          # Any command failure exits the step immediately.
          set -euo pipefail

          GITLEAKS_VERSION="8.24.3"

          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks

          chmod +x gitleaks

          mkdir -p "${HOME}/.local/bin"
          mv gitleaks "${HOME}/.local/bin/gitleaks"

          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

          gitleaks version

      - name: Run Gitleaks Scan
        id: gitleaks
        shell: bash
        run: |
          # Do NOT auto-exit on command failure
          set +e

          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

          EXIT_CODE=$?

          echo "exitcode=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Regardless of Gitleaks result, mark THIS step as successful.
          exit 0
        # env:
        # Required for GitHub Organization repositories.
        # Apply for free license at gitleaks.io for org use.
        # For personal repos, this env var can be removed.
        # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF to GitHub Security Tab
        # Run regardless of steps Passed/failed and only if file exists
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: secret-scanning

      - name: Upload Gitleaks Report as Artifact
        # Run regardless of steps Passed/failed and only if file exists
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-security-report
          path: gitleaks.sarif
          retention-days: 90

      - name: Fail Pipeline if Secrets Found
        if: steps.gitleaks.outputs.exitcode == '1'
        run: |
          echo "❌ Gitleaks found secrets in the codebase!"
          echo "Check the GitHub Security tab and workflow artifact."
          exit 1

      - name: Fail Pipeline if Gitleaks Crashed
        if: |
          steps.gitleaks.outputs.exitcode != '0' &&
          steps.gitleaks.outputs.exitcode != '1'
        shell: bash
        run: |
          echo "❌ Gitleaks execution failed unexpectedly."
          exit 2
