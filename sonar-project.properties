# SonarQube Project Configuration
# Place in: root of your application repository

# Unique key for this project in SonarQube.
# Create this in SonarQube UI first: Projects → Create Project
# Use format: company-name_project-name (no spaces)
sonar.projectKey=mycompany_myapp

# Human-readable name shown in SonarQube dashboard
sonar.projectName=My Application

# Version shown in SonarQube (optional — pipeline sets this too)
sonar.projectVersion=1.0

# SOURCE CODE LOCATION
sonar.sources=src
# If multiple source folders:
# sonar.sources=src,lib,app


# TEST FILES LOCATION
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts

# COVERAGE REPORT
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# For TypeScript projects, also add:
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# EXCLUSIONS: Files and folders SonarQube should IGNORE.
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  **/*.min.js,\
  **/__mocks__/**

# LANGUAGE
sonar.language=js
# For TypeScript:
# sonar.language=ts
# For multiple languages, remove this line — SonarQube auto-detects

# ENCODING
sonar.sourceEncoding=UTF-8
